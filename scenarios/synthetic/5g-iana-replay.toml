# The 5G-IANA drive test (scenarios/measured/5g-iana-2023-01-29) replayed on
# both directions of one link, sample by sample (SPEC 020 EMU-12): each
# sample's one-way delay (half the RTT), jitter, loss and rate are in force for
# its interval, outages drop, and the trace repeats every 5 147 s. The bucket
# and queue are not in the trace; these sizes are guessed (ADR-29).
