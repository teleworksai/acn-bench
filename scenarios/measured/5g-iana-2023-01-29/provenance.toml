[collection]
date = "2023-01-29"
device = "OnePlus 9 handset (the record's UE)"
technology = "5G NR (the record does not say NSA or SA)"
network = "testbed"
location_class = "roads around a testbed site in southern Germany"
mobility = "drive"
method = "A drive-test app on the handset ran a test about every 26 s for about 86 minutes: a ping series, summarised as average, minimum, maximum and standard deviation of the round-trip time and the percentage lost, and a downlink and an uplink throughput test. The record states neither the ping target, the probe count, nor the test durations."

[conversion]
tool = "cargo xtask import-5g-iana"
tool_path = "crates/xtask/src/import_5g_iana.rs"
tool_blake3 = "2864bd5bc078a250e25438ffbfcc075066c2b2af4de321bd63ca1dd7a717c6e0"
dropped = [
    "coordinates of every test (EMU-63: never coordinates)",
    "the cell identifier in every placemark name (EMU-63: no identifiers)",
    "wall-clock TIME, replaced by t_s, seconds since the first kept test (EMU-63)",
    "TEST DL MAX and TEST UL MAX, the peak throughput within a test (EMU-62 holds the test's mean)",
    "the first placemark, which ran throughput tests but no ping test, so has no loss (EMU-62 needs one)",
    "the record's DL and UL files, not read: they hold the same placemarks and fields as the PING file and differ from it only in colour styling",
    "the KML styling (colours, icons), which encodes nothing beyond the fields above",
]

