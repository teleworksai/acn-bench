# The uplink drops everything sent in its first minute (SPEC 020 EMU-7): the
# first calls' requests are lost, so they end at their deadline (EMU-35).
schema_version = 1
name = "uplink-down"

[[link]]
name = "path"
direction = "up"

[[link.outage.window]]
start_ms = 0
end_ms = 60000
mode = "drop"
cause = "scheduled"

[[link]]
name = "path"
direction = "down"
