[package]
name = "acn-accept"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Spec-acceptance suites, one file per POC under tests/accept/ (CON-12 `accept` tier)."
# Suites live directly in this directory, not under tests/, so each is declared:
#   [[test]]
#   name = "p4"
#   path = "p4.rs"
autotests = false

[lints]
workspace = true

[dependencies]
acn-harness = { path = "../../crates/acn-harness" }
acn-hyp = { path = "../../crates/acn-hyp" }
acn-trace = { workspace = true, features = ["io"] }

[dev-dependencies]
blake3.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "trace_determinism"
path = "trace_determinism.rs"

[[test]]
name = "trace_roundtrip"
path = "trace_roundtrip.rs"

[[test]]
name = "harness_sim"
path = "harness_sim.rs"

[[test]]
name = "hyp_lint"
path = "hyp_lint.rs"
