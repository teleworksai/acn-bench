[package]
name = "acn-accept"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Spec-acceptance suites, one file per POC under tests/accept/ (CON-12 `accept` tier)."
# Suites live directly in this directory, not under tests/, so each is declared:
#   [[test]]
#   name = "p4"
#   path = "p4.rs"
autotests = false
# SPEC 070's suite, ctl.rs, drives the `acn` binary, so it is acn-cli's test
# (`cargo test -p acn-cli --test accept_ctl`; ADR-39).

[lints]
workspace = true

[dependencies]
acn-attrib = { path = "../../crates/acn-attrib" }
acn-cli = { path = "../../crates/acn-cli" }
acn-gen = { path = "../../crates/acn-gen" }
acn-harness = { path = "../../crates/acn-harness" }
acn-hyp = { path = "../../crates/acn-hyp" }
acn-mockllm = { path = "../../crates/acn-mockllm" }
acn-trace = { workspace = true, features = ["io"] }

[dev-dependencies]
arrow-array.workspace = true
acn-emu = { path = "../../crates/acn-emu" }
blake3.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[[test]]
name = "trace_determinism"
path = "trace_determinism.rs"

[[test]]
name = "trace_roundtrip"
path = "trace_roundtrip.rs"

[[test]]
name = "harness_sim"
path = "harness_sim.rs"

[[test]]
name = "gen_sim"
path = "gen_sim.rs"

[[test]]
name = "hyp_lint"
path = "hyp_lint.rs"

[[test]]
name = "hyp_verdict"
path = "hyp_verdict.rs"

[[test]]
name = "evidence_chain"
path = "evidence_chain.rs"

[[test]]
name = "p4"
path = "p4.rs"

[[test]]
name = "gates"
path = "gates.rs"

[[test]]
name = "emu_sim"
path = "emu_sim.rs"

[[test]]
name = "attrib"
path = "attrib.rs"

[[test]]
name = "kit"
path = "kit.rs"
