[package]
name = "acn-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The `acn` binary: subcommands over the substrate crates (CON-8)."
build = "build.rs"

# The library holds what the acceptance suites run as the CLI does: the
# loop's harness executor (LOOP-15).
[lib]
path = "src/lib.rs"

[[bin]]
name = "acn"
path = "src/main.rs"

[lints]
workspace = true

[features]
# HAR-20: real-provider backends; off in CI's default tiers.
real-api = ["acn-harness/real-api"]

[dependencies]
acn-gen = { path = "../acn-gen" }
acn-harness = { path = "../acn-harness" }
acn-hyp = { path = "../acn-hyp" }
acn-mockllm = { path = "../acn-mockllm" }
acn-trace = { workspace = true, features = ["io"] }
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
# CON-31: the build script computes build_hash and engine_hash with the same code
# the run path checks them with. Without `io`, so no Arrow in the build script.
acn-trace.workspace = true
toml.workspace = true

[dev-dependencies]
acn-emu = { path = "../acn-emu" }
tempfile.workspace = true
