[package]
name = "acn-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "minimal agent harness with switchable discipline knobs (SPEC 040)."

[lints]
workspace = true

[features]
# HAR-20: every path that can reach a real provider (credentials, the provider
# backends) compiles only with this feature; CI's default tiers never do.
real-api = []

[dependencies]
acn-emu = { path = "../acn-emu" }
acn-mockllm = { path = "../acn-mockllm" }
acn-trace = { workspace = true, features = ["io"] }
blake3.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
futures-util.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
