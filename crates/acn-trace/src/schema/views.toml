# views.toml — every column of every derived view (TRC-37). FROZEN SET (CON-7).
# The view writer is checked against this file, so the prose of TRC-31..34 and TRC-38
# and the files on disk cannot drift; TRC-36 and the quantity table of HYP-12 resolve
# column names here. Columns are written in the order of this file. Durations are int64
# nanoseconds: a `_ms` float attribute is converted once per span, by round-half-even of
# value x 1e6, before any aggregation, and every aggregate is an integer sum, so no value
# depends on summation order. A time that the spans carry as timestamps (ttft, durations)
# is computed from the timestamps, not from the float. A sum over values that may be
# absent is null when ANY term is absent: a partial total never passes for a complete one.
# When `source`, up to any `;` note, is exactly an attribute name, the loader checks the column against the
# inventory: nullable exactly when the attribute is optional, and a matching type.
# A column is nullable exactly when the span data it comes from may be absent; an
# absent value is null, never zero (SPEC 010 section 3).

schema_version = 1

