# lab/p1a-atlas — the stand-in control: four request/response exchanges with no
# tools, no streaming and a one-token reply, so the server's time is one prefill
# and one token. It is NOT the plain-RPC control of CON-18 (SPEC 050, T13b): it
# still goes through the harness and the mock model. It is the nearest thing the
# run path can produce today.
schema_version = 1

[agent]
system_prompt = "Answer with one word."
temperature = 0.0
max_tokens = 1
stream = false
max_calls_per_turn = 1
compact_at_tokens = 100000
read_cost_threshold_tokens = 50000
summary_instruction = "Summarise."
summary_max_tokens = 1

[[task]]
id = "calls"
tools = []

[[task.turn]]
user = "status?"
think_time_ns = { min = 0, max = 0 }

[[task.turn]]
user = "status?"
think_time_ns = { min = 0, max = 0 }

[[task.turn]]
user = "status?"
think_time_ns = { min = 0, max = 0 }

[[task.turn]]
user = "status?"
think_time_ns = { min = 0, max = 0 }
