[package]
name = "lab-p4-pilot"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
arrow-array = "60"
clap = { version = "4", features = ["derive"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# An empty [workspace] makes this crate its own workspace root, so cargo never
# walks up to the substrate's manifest (ADR-7). Keep it.
[workspace]
