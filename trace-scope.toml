# T02 lands as a series of PRs (ADR-11); each adds the IDs it completes. Cited ahead of
# scope by T02a: TRC-3 and TRC-12 (value sets). T02b (ADR-13) cites ahead of scope:
# TRC-1 (producers emit through the SDK; the harness is T04), TRC-19 (resources are
# checked; the ban on commit identifiers is not machine-checkable). T02c (ADR-14) adds
# the views and the ingester; T02d (ADR-15) OTLP, report coverage and clock offsets.
# TRC-18 stays out: deriving acn.server.* from node spans needs a frozen mapping (T30). CON-28's kit clause and CON-29's live-option clause bind T16 and T04.
# Not yet in scope although cited: CON-5 (its clippy clause and the raw-output golden
# vector exist; acn_emu::{clock,rng} and the ranged/distribution vectors land in T10–T12).
# CON-14 is cited by the pr-check tests but stays out of scope: the label rule is
