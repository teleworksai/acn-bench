# workloads/harness-smoke.toml — the harness's own test workload (HAR-61): two short
# tasks that exercise the loop, tools, the checker, backfill, compaction and fan-out
# in a handful of calls on the mock. Hashed as working-tree bytes (CON-27(a)).
schema_version = 1

[agent]
system_prompt = """You are a careful software engineer working in a small repository. \
Read before you edit, keep changes minimal, explain each step in one sentence, and \
stop when the task is done. Prefer the read_file tool to guessing, prefer grep to \
reading whole directories, and delegate independent investigations to helpers when \
they can run in parallel. Never invent file contents; quote what the tools return."""
temperature = 0.0
max_tokens = 64
stream = true
max_calls_per_turn = 6
compact_at_tokens = 1000
read_cost_threshold_tokens = 400
summary_instruction = "Summarise the conversation so far in a few sentences, keeping file names and decisions."
summary_max_tokens = 32

[[tool]]
name = "read_file"
class = "file"
description = "Read a file from the repository and return its contents."
parameters = { type = "object", properties = { path = { type = "string" } }, required = ["path"] }
result_bytes = { min = 600, max = 1200 }
duration_ns = { min = 1_000_000, max = 3_000_000 }

[[tool]]
name = "grep"
class = "search"
description = "Search the repository for a regular expression and return matching lines."
parameters = { type = "object", properties = { pattern = { type = "string" } }, required = ["pattern"] }
result_bytes = { min = 200, max = 500 }
duration_ns = { min = 2_000_000, max = 6_000_000 }

[[tool]]
name = "delegate"
class = "subagent"
description = "Hand an independent investigation to helper agents and return their findings."
parameters = { type = "object", properties = { task = { type = "string" } }, required = ["task"] }
width = 2

[tool.child]
system_prompt = "You are a helper. Investigate what you are asked and answer in two sentences."
instruction = "Find where the configuration file is parsed and report the function name."
tools = ["read_file"]
max_calls = 3

[[task]]
id = "edit"
tools = ["read_file", "grep"]

[[task.turn]]
user = "Open src/config.rs and tell me what the parser does with unknown keys."
think_time_ns = { min = 0, max = 0 }
expect_tools = ["read_file"]

[[task.turn]]
user = "I changed src/config.rs; check the new version and say whether unknown keys are now rejected."
think_time_ns = { min = 1_000_000_000, max = 3_000_000_000 }
updates = [0]
deadline_ms = 600_000

[[task.turn]]
user = "Now make the error message name the offending key."
think_time_ns = { min = 500_000_000, max = 1_500_000_000 }

[[task]]
id = "fanout"
tools = ["delegate", "read_file"]

[[task.turn]]
user = "Investigate how configuration is loaded across the code base."
think_time_ns = { min = 0, max = 0 }
expect_tools = ["delegate"]
