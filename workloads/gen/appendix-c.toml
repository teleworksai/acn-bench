# workloads/gen/appendix-c.toml — the generator's shipped sheet (SPEC 050 GEN-1).
# PLACEHOLDER values of a plausible shape, not the report's Appendix C numbers,
# which replace them in a data-only PR (ADR-38). Every parameter is stated; a
# quantile table is [[p in parts per million, value], …] from p = 0 to 1000000.
schema_version = 1
placeholder = true
doc = "Agent sessions of the report's traffic model, with placeholder values."
model = "mock-agentic"
sessions = 8
system_tokens = 2000
summary_instruction_tokens = 40
summary_max_tokens = 500
compact_at_tokens = 100000

session_start_ns = { quantiles = [[0, 0], [500000, 2_000_000_000], [1000000, 10_000_000_000]] }
