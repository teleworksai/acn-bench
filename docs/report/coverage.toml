# coverage.toml — how each key of SPEC 010 Appendix A is recorded (TRC-36).
# Documentation-grade: outside crates/, so it moves neither env_hash nor build_hash.
# `cargo xtask docs-inventory` checks every entry against views.toml (TRC-37) and
# acn_attributes.toml (TRC-20) and renders docs/generated/report-coverage.md.
# kind = "column"       -> view, column
# kind = "attribute"    -> attribute (a promoted acn.* attribute)
# kind = "derived"      -> expression, columns (each `view.column` it reads)
# kind = "not_recorded" -> reason, side_channel

report_version = "v1.2"

# ---- §3.5 harness-side fields
[[key]]
key = "h.session_id"
kind = "column"
view = "call"
column = "session_id"

[[key]]
key = "h.turn_index"
kind = "column"
view = "call"
column = "turn_index"

[[key]]
key = "h.call_index"
kind = "column"
view = "call"
column = "call_index"

[[key]]
key = "h.input_tokens"
kind = "column"
view = "call"
column = "input_tokens"

[[key]]
key = "h.cached_input_tokens"
kind = "column"
view = "call"
column = "cache_read_tokens"

[[key]]
key = "h.output_tokens"
kind = "column"
view = "call"
column = "output_tokens"

[[key]]
key = "h.stop_reason"
kind = "column"
view = "call"
column = "stop_reason"

[[key]]
key = "h.ttft"
kind = "column"
view = "call"
column = "ttft_ns"

[[key]]
key = "h.total_time"
kind = "column"
view = "call"
column = "duration_ns"

[[key]]
key = "h.preceding_tool_class"
kind = "column"
view = "call"
column = "preceding_tool_class"

[[key]]
key = "h.preceding_tool_time"
kind = "column"
view = "call"
column = "preceding_tool_ns"

[[key]]
key = "h.spawn_parent_call"
kind = "attribute"
attribute = "acn.fanout.parent_call"

# ---- Appendix C: session level
[[key]]
key = "s.turns_per_session"
kind = "column"
view = "session"
column = "turns"

[[key]]
key = "s.think_time"
kind = "column"
view = "turn"
column = "think_time_before_ns"

[[key]]
key = "s.session_lifetime"
kind = "column"
view = "session"
column = "duration_ns"

# ---- Appendix C: turn level
[[key]]
key = "t.chain_length"
kind = "column"
view = "turn"
column = "chain_length"

[[key]]
key = "t.tool_exec_time_by_class"
kind = "derived"
expression = "distribution of tool.duration_ns grouped by tool.tool_class"
columns = ["tool.duration_ns", "tool.tool_class"]

[[key]]
key = "t.fanout_degree_depth"
kind = "derived"
expression = "joint distribution of turn.fanout_width and turn.fanout_depth"
columns = ["turn.fanout_width", "turn.fanout_depth"]

[[key]]
key = "t.compaction_vs_length"
kind = "derived"
expression = "share of turns with turn.compaction != none, by the input_tokens of the turn's last main-chain call"
columns = ["turn.compaction", "turn.turn_index", "call.input_tokens", "call.turn_index", "call.lineage_id"]

# ---- Appendix C: call level
[[key]]
key = "c.input_length_by_call_index"
kind = "derived"
expression = "distribution of call.input_tokens grouped by call.call_index"
columns = ["call.input_tokens", "call.call_index"]

[[key]]
key = "c.new_tokens_per_call"
kind = "column"
view = "call"
column = "new_input_tokens"

[[key]]
key = "c.output_length_by_call_type"
kind = "derived"
expression = "distribution of call.output_tokens grouped by call.stop_reason (tool_use: a tool call; end_turn: a final answer)"
columns = ["call.output_tokens", "call.stop_reason"]

[[key]]
key = "c.cached_token_ratio"
kind = "column"
view = "call"
column = "cached_token_ratio"

# ---- Appendix C: bytes on the wire
[[key]]
key = "b.wire_bytes_per_token"
kind = "derived"
expression = "(call.wire_bytes_up + call.wire_bytes_down) / (call.input_tokens + call.output_tokens)"
columns = ["call.wire_bytes_up", "call.wire_bytes_down", "call.input_tokens", "call.output_tokens"]

[[key]]
key = "b.decode_packet_size_interarrival"
kind = "not_recorded"
reason = "a view holds the ITL quantiles (call.itl_p50_ns, call.itl_p99_ns), not the per-packet distribution"
side_channel = "sidecar/*.pcapng in netem runs (TRC-41)"

[[key]]
key = "b.uplink_bytes_per_tool_result"
kind = "derived"
expression = "distribution of tool.result_bytes grouped by tool.tool_class"
columns = ["tool.result_bytes", "tool.tool_class"]

# ---- Appendix C: fleet level (properties of many sessions)
[[key]]
key = "f.diurnal_weekly"
kind = "not_recorded"
reason = "a run's clock is virtual or monotonic from its start (TRC-26); time of day and week are properties of a fleet, not of one run"
side_channel = "none in a bundle: fleet telemetry outside acn-bench; a generator reproduces the pattern from the Appendix C sheet (SPEC 050)"

[[key]]
key = "f.cross_session_prefix_overlap"
kind = "not_recorded"
reason = "message content is never recorded (TRC-42), so prefixes cannot be compared across sessions"
side_channel = "none yet: prefix-block hashes are the planned carrier (SPEC 010 open question 1, POC 11)"

[[key]]
key = "f.batch_burst_structure"
kind = "not_recorded"
reason = "session start times are span timestamps, not a view column"
side_channel = "spans.parquet: start_ns of the acn.session spans of a run"
